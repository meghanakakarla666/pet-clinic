<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${owner.id != null ? 'Edit Owner' : 'Add Owner'} + ' - Pet Clinic'">Add Owner - Pet Clinic</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .form-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <h2 class="mb-0">
                    <i class="bi bi-person-fill-add text-primary"></i>
                    <span th:text="${owner.id != null ? 'Edit Owner' : 'Add New Owner'}">Add New Owner</span>
                </h2>
                <a href="/pet-clinic/owners" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back to List
                </a>
            </div>

            <!-- Error Messages -->
            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i> Please correct the errors below:
                <ul class="mb-0 mt-2">
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Form -->
            <form th:action="@{/owners}" th:object="${owner}" method="post">
                <input type="hidden" th:field="*{id}" />
                
                <div class="row g-3">
                    <!-- First Name -->
                    <div class="col-md-6">
                        <label for="firstName" class="form-label fw-bold">
                            <i class="bi bi-person"></i> First Name <span class="text-danger">*</span>
                        </label>
                        <input type="text" 
                               class="form-control form-control-lg" 
                               id="firstName" 
                               th:field="*{firstName}" 
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''"
                               placeholder="Enter first name"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                    </div>

                    <!-- Last Name -->
                    <div class="col-md-6">
                        <label for="lastName" class="form-label fw-bold">
                            <i class="bi bi-person"></i> Last Name <span class="text-danger">*</span>
                        </label>
                        <input type="text" 
                               class="form-control form-control-lg" 
                               id="lastName" 
                               th:field="*{lastName}" 
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''"
                               placeholder="Enter last name"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                    </div>

                    <!-- Address -->
                    <div class="col-12">
                        <label for="address" class="form-label fw-bold">
                            <i class="bi bi-house"></i> Address <span class="text-danger">*</span>
                        </label>
                        <input type="text" 
                               class="form-control form-control-lg" 
                               id="address" 
                               th:field="*{address}" 
                               th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"
                               placeholder="Enter street address"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                    </div>

                    <!-- City -->
                    <div class="col-md-6">
                        <label for="city" class="form-label fw-bold">
                            <i class="bi bi-geo-alt"></i> City <span class="text-danger">*</span>
                        </label>
                        <input type="text" 
                               class="form-control form-control-lg" 
                               id="city" 
                               th:field="*{city}" 
                               th:classappend="${#fields.hasErrors('city')} ? 'is-invalid' : ''"
                               placeholder="Enter city"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                    </div>

                    <!-- Phone -->
                    <div class="col-md-6">
                        <label for="phone" class="form-label fw-bold">
                            <i class="bi bi-telephone"></i> Phone <span class="text-danger">*</span>
                        </label>
                        <input type="tel" 
                               class="form-control form-control-lg" 
                               id="phone" 
                               th:field="*{phone}" 
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                               placeholder="Enter phone number"
                               pattern="[0-9]{10}"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">
                            Please enter a valid 10-digit phone number
                        </div>
                        <small class="form-text text-muted">Format: 10 digits (e.g., 5551234567)</small>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4 pt-3 border-top">
                    <a href="/pet-clinic/owners" class="btn btn-lg btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-lg btn-primary px-5">
                        <i class="bi bi-check-circle"></i>
                        <span th:text="${owner.id != null ? 'Update Owner' : 'Add Owner'}">Add Owner</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
