<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${owner.id != null ? 'Edit Owner' : 'Add Owner'} + ' - Pet Clinic'">Add Owner - Pet Clinic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .header {
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        .nav-links {
            margin-bottom: 20px;
        }
        
        .nav-links a {
            color: #007bff;
            text-decoration: none;
            margin-right: 15px;
            padding: 5px 10px;
            border: 1px solid #007bff;
            border-radius: 3px;
        }
        
        .nav-links a:hover {
            background: #007bff;
            color: white;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        input[type="text"]:focus, input[type="tel"]:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }
        
        .btn-primary {
            background: #007bff;
            color: white;
        }
        
        .btn-primary:hover {
            background: #0056b3;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-left: 10px;
        }
        
        .btn-secondary:hover {
            background: #545b62;
        }
        
        .error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .required {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <div class="nav-links">
            <a th:href="@{/}">🏠 Dashboard</a>
            <a th:href="@{/owners}">👥 Owners</a>
            <a th:href="@{/pets}">🐕 Pets</a>
            <a th:href="@{/consultations}">🏥 Consultations</a>
        </div>

        <!-- Header -->
        <div class="header">
            <h1 th:text="${owner.id != null ? '✏️ Edit Owner' : '➕ Add New Owner'}">Add New Owner</h1>
            <p th:text="${owner.id != null ? 'Update owner information' : 'Enter owner details'}">Enter owner details</p>
        </div>

        <!-- Owner Form -->
        <form th:action="@{/owners}" th:object="${owner}" method="post">
            <!-- Hidden ID field for editing only -->
            <input type="hidden" th:field="*{id}" th:if="${owner.id != null}">

            <div class="form-group">
                <label for="firstName">First Name <span class="required">*</span></label>
                <input type="text" id="firstName" th:field="*{firstName}" required placeholder="Enter first name">
                <div class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name <span class="required">*</span></label>
                <input type="text" id="lastName" th:field="*{lastName}" required placeholder="Enter last name">
                <div class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" th:field="*{address}" placeholder="Enter street address">
                <div class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" th:field="*{city}" placeholder="Enter city">
                <div class="error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" th:field="*{phone}" placeholder="Enter phone number">
                <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <div style="margin-top: 30px;">
                <button type="submit" class="btn btn-primary" 
                        th:text="${owner.id != null ? '💾 Update Owner' : '➕ Add Owner'}">
                    Add Owner
                </button>
                <a th:href="@{/owners}" class="btn btn-secondary">❌ Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
