<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owners List - Pet Clinic</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .list-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
        .table-hover tbody tr:hover {
            background-color: #f8f9fa;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="list-container">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h2 class="mb-1">
                        <i class="bi bi-people-fill text-primary"></i> Owners List
                    </h2>
                    <p class="text-muted mb-0">Manage all pet owners</p>
                </div>
                <div>
                    <a href="/pet-clinic" class="btn btn-outline-secondary me-2">
                        <i class="bi bi-house"></i> Home
                    </a>
                    <a href="/pet-clinic/owners/new" class="btn btn-primary">
                        <i class="bi bi-person-plus-fill"></i> Add New Owner
                    </a>
                </div>
            </div>

            <!-- Success Message -->
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Search Bar -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="input-group input-group-lg">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchInput" placeholder="Search owners by name, city, or phone...">
                    </div>
                </div>
                <div class="col-md-6 text-end">
                    <span class="badge bg-primary fs-6">
                        Total Owners: <span th:text="${#lists.size(owners)}">0</span>
                    </span>
                </div>
            </div>

            <!-- Owners Table -->
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle" id="ownersTable">
                    <thead class="table-primary">
                        <tr>
                            <th><i class="bi bi-person"></i> Name</th>
                            <th><i class="bi bi-house"></i> Address</th>
                            <th><i class="bi bi-geo-alt"></i> City</th>
                            <th><i class="bi bi-telephone"></i> Phone</th>
                            <th class="text-center"><i class="bi bi-gear"></i> Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(owners)}">
                            <td colspan="5" class="text-center py-5">
                                <i class="bi bi-inbox display-1 text-muted"></i>
                                <p class="mt-3 text-muted">No owners found. Click "Add New Owner" to get started.</p>
                            </td>
                        </tr>
                        <tr th:each="owner : ${owners}">
                            <td class="fw-bold">
                                <i class="bi bi-person-circle text-primary"></i>
                                <span th:text="${owner.firstName + ' ' + owner.lastName}">John Doe</span>
                            </td>
                            <td th:text="${owner.address}">123 Main St</td>
                            <td>
                                <span class="badge bg-info" th:text="${owner.city}">Springfield</span>
                            </td>
                            <td>
                                <i class="bi bi-telephone-fill text-success"></i>
                                <span th:text="${owner.phone}">5551234567</span>
                            </td>
                            <td class="text-center">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/owners/{id}(id=${owner.id})}" 
                                       class="btn btn-sm btn-outline-primary" 
                                       title="View Details">
                                        <i class="bi bi-eye-fill"></i>
                                    </a>
                                    <a th:href="@{/owners/edit/{id}(id=${owner.id})}" 
                                       class="btn btn-sm btn-outline-warning" 
                                       title="Edit">
                                        <i class="bi bi-pencil-fill"></i>
                                    </a>
                                    <form th:action="@{/owners/delete/{id}(id=${owner.id})}" 
                                          method="post" 
                                          style="display: inline;"
                                          onsubmit="return confirm('Are you sure you want to delete this owner?');">
                                        <button type="submit" 
                                                class="btn btn-sm btn-outline-danger" 
                                                title="Delete">
                                            <i class="bi bi-trash-fill"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Footer Info -->
            <div class="mt-4 pt-3 border-top text-center text-muted">
                <small>
                    <i class="bi bi-info-circle"></i> 
                    Click on any owner to view full details
                </small>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Search Functionality -->
    <script>
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const searchValue = this.value.toLowerCase();
            const table = document.getElementById('ownersTable');
            const rows = table.getElementsByTagName('tbody')[0].getElementsByTagName('tr');
            
            for (let row of rows) {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchValue) ? '' : 'none';
            }
        });
    </script>
</body>
</html>
