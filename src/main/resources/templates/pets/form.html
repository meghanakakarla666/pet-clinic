<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pet.id != null ? 'Edit Pet' : 'Add Pet'} + ' - Pet Clinic'">Add Pet - Pet Clinic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .header {
            border-bottom: 2px solid #28a745;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        .nav-links {
            margin-bottom: 20px;
        }
        
        .nav-links a {
            color: #007bff;
            text-decoration: none;
            margin-right: 15px;
            padding: 5px 10px;
            border: 1px solid #007bff;
            border-radius: 3px;
        }
        
        .nav-links a:hover {
            background: #007bff;
            color: white;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            outline: none;
            border-color: #28a745;
            box-shadow: 0 0 5px rgba(40,167,69,0.3);
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }
        
        .btn-primary {
            background: #28a745;
            color: white;
        }
        
        .btn-primary:hover {
            background: #218838;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-left: 10px;
        }
        
        .btn-secondary:hover {
            background: #545b62;
        }
        
        .error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .required {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <div class="nav-links">
            <a th:href="@{/}">🏠 Dashboard</a>
            <a th:href="@{/owners}">👥 Owners</a>
            <a th:href="@{/pets}">🐕 Pets</a>
            <a th:href="@{/consultations}">🏥 Consultations</a>
        </div>

        <!-- Header -->
        <div class="header">
            <h1 th:text="${pet.id != null ? '✏️ Edit Pet' : '➕ Add New Pet'}">Add New Pet</h1>
            <p th:text="${pet.id != null ? 'Update pet information' : 'Enter pet details'}">Enter pet details</p>
        </div>

        <!-- Pet Form -->
        <form th:action="@{/pets}" th:object="${pet}" method="post">
            <!-- Hidden ID field for editing only -->
            <input type="hidden" th:field="*{id}" th:if="${pet.id != null}">

            <div class="form-group">
                <label for="name">Pet Name <span class="required">*</span></label>
                <input type="text" id="name" th:field="*{name}" required placeholder="Enter pet name">
                <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <label for="type">Pet Type <span class="required">*</span></label>
                <select id="type" th:field="*{type}" required>
                    <option value="">Select pet type</option>
                    <option value="DOG">Dog</option>
                    <option value="CAT">Cat</option>
                    <option value="BIRD">Bird</option>
                    <option value="RABBIT">Rabbit</option>
                    <option value="HAMSTER">Hamster</option>
                    <option value="FISH">Fish</option>
                    <option value="OTHER">Other</option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
            </div>

            <div class="form-group">
                <label for="breed">Breed</label>
                <input type="text" id="breed" th:field="*{breed}" placeholder="Enter breed (optional)">
                <div class="error" th:if="${#fields.hasErrors('breed')}" th:errors="*{breed}"></div>
            </div>

            <div class="form-group">
                <label for="birthDate">Birth Date</label>
                <input type="date" id="birthDate" th:field="*{birthDate}">
                <div class="error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
            </div>

            <div class="form-group">
                <label for="owner">Owner <span class="required">*</span></label>
                <select id="owner" th:field="*{owner.id}" required>
                    <option value="">Select owner</option>
                    <option th:each="owner : ${owners}" 
                            th:value="${owner.id}" 
                            th:text="${owner.firstName + ' ' + owner.lastName}">John Doe</option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('owner')}" th:errors="*{owner}"></div>
            </div>

            <div style="margin-top: 30px;">
                <button type="submit" class="btn btn-primary" 
                        th:text="${pet.id != null ? '💾 Update Pet' : '➕ Add Pet'}">
                    Add Pet
                </button>
                <a th:href="@{/pets}" class="btn btn-secondary">❌ Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
