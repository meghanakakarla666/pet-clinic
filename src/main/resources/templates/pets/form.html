<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pet.id != null ? 'Edit Pet' : 'Register Pet'} + ' - Pet Clinic'">Register Pet - Pet Clinic</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .form-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <h2 class="mb-0">
                    <i class="bi bi-heart-fill text-danger"></i>
                    <span th:text="${pet.id != null ? 'Edit Pet' : 'Register New Pet'}">Register New Pet</span>
                </h2>
                <a href="/pet-clinic/pets" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back to List
                </a>
            </div>

            <!-- Error Messages -->
            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i> Please correct the errors below:
                <ul class="mb-0 mt-2">
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Form -->
            <form th:action="@{/pets}" th:object="${pet}" method="post">
                <input type="hidden" th:field="*{id}" />
                
                <div class="row g-3">
                    <!-- Pet Name -->
                    <div class="col-md-6">
                        <label for="name" class="form-label fw-bold">
                            <i class="bi bi-tag"></i> Pet Name <span class="text-danger">*</span>
                        </label>
                        <input type="text" 
                               class="form-control form-control-lg" 
                               id="name" 
                               th:field="*{name}" 
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                               placeholder="Enter pet name"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <!-- Pet Type -->
                    <div class="col-md-6">
                        <label for="type" class="form-label fw-bold">
                            <i class="bi bi-list"></i> Pet Type <span class="text-danger">*</span>
                        </label>
                        <select class="form-select form-select-lg" 
                                id="type" 
                                th:field="*{type}" 
                                th:classappend="${#fields.hasErrors('type')} ? 'is-invalid' : ''"
                                required>
                            <option value="">Select pet type...</option>
                            <option value="Dog">🐕 Dog</option>
                            <option value="Cat">🐈 Cat</option>
                            <option value="Bird">🐦 Bird</option>
                            <option value="Rabbit">🐰 Rabbit</option>
                            <option value="Hamster">🐹 Hamster</option>
                            <option value="Guinea Pig">Guinea Pig</option>
                            <option value="Other">Other</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                    </div>

                    <!-- Birth Date -->
                    <div class="col-md-6">
                        <label for="birthDate" class="form-label fw-bold">
                            <i class="bi bi-calendar"></i> Birth Date <span class="text-danger">*</span>
                        </label>
                        <input type="date" 
                               class="form-control form-control-lg" 
                               id="birthDate" 
                               th:field="*{birthDate}" 
                               th:classappend="${#fields.hasErrors('birthDate')} ? 'is-invalid' : ''"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
                    </div>

                    <!-- Owner -->
                    <div class="col-md-6">
                        <label for="owner" class="form-label fw-bold">
                            <i class="bi bi-person"></i> Owner <span class="text-danger">*</span>
                        </label>
                        <select class="form-select form-select-lg" 
                                id="owner" 
                                th:field="*{owner.id}" 
                                required>
                            <option value="">Select owner...</option>
                            <option th:each="owner : ${owners}" 
                                    th:value="${owner.id}" 
                                    th:text="${owner.firstName + ' ' + owner.lastName}">
                                Owner Name
                            </option>
                        </select>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4 pt-3 border-top">
                    <a href="/pet-clinic/pets" class="btn btn-lg btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-lg btn-danger px-5">
                        <i class="bi bi-check-circle"></i>
                        <span th:text="${pet.id != null ? 'Update Pet' : 'Register Pet'}">Register Pet</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
