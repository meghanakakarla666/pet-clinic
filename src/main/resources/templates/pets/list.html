<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets List - Pet Clinic</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .list-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="list-container">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h2 class="mb-1">
                        <i class="bi bi-heart-fill text-danger"></i> Pets List
                    </h2>
                    <p class="text-muted mb-0">All registered pets</p>
                </div>
                <div>
                    <a href="/pet-clinic" class="btn btn-outline-secondary me-2">
                        <i class="bi bi-house"></i> Home
                    </a>
                    <a href="/pet-clinic/pets/new" class="btn btn-danger">
                        <i class="bi bi-plus-circle-fill"></i> Register New Pet
                    </a>
                </div>
            </div>

            <!-- Success Message -->
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Search Bar -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="input-group input-group-lg">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchInput" placeholder="Search pets by name, type, or owner...">
                    </div>
                </div>
                <div class="col-md-6 text-end">
                    <span class="badge bg-danger fs-6">
                        Total Pets: <span th:text="${#lists.size(pets)}">0</span>
                    </span>
                </div>
            </div>

            <!-- Pets Table -->
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle" id="petsTable">
                    <thead class="table-danger">
                        <tr>
                            <th><i class="bi bi-tag"></i> Pet Name</th>
                            <th><i class="bi bi-list"></i> Type</th>
                            <th><i class="bi bi-calendar"></i> Birth Date</th>
                            <th><i class="bi bi-person"></i> Owner</th>
                            <th class="text-center"><i class="bi bi-gear"></i> Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(pets)}">
                            <td colspan="5" class="text-center py-5">
                                <i class="bi bi-inbox display-1 text-muted"></i>
                                <p class="mt-3 text-muted">No pets registered yet. Click "Register New Pet" to get started.</p>
                            </td>
                        </tr>
                        <tr th:each="pet : ${pets}">
                            <td class="fw-bold">
                                <i class="bi bi-heart-fill text-danger"></i>
                                <span th:text="${pet.name}">Fluffy</span>
                            </td>
                            <td>
                                <span class="badge bg-secondary" th:text="${pet.type}">Dog</span>
                            </td>
                            <td th:text="${#temporals.format(pet.birthDate, 'MMM dd, yyyy')}">Jan 01, 2020</td>
                            <td th:text="${pet.owner.firstName + ' ' + pet.owner.lastName}">John Doe</td>
                            <td class="text-center">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/pets/{id}(id=${pet.id})}" 
                                       class="btn btn-sm btn-outline-primary" 
                                       title="View Details">
                                        <i class="bi bi-eye-fill"></i>
                                    </a>
                                    <a th:href="@{/pets/edit/{id}(id=${pet.id})}" 
                                       class="btn btn-sm btn-outline-warning" 
                                       title="Edit">
                                        <i class="bi bi-pencil-fill"></i>
                                    </a>
                                    <form th:action="@{/pets/delete/{id}(id=${pet.id})}" 
                                          method="post" 
                                          style="display: inline;"
                                          onsubmit="return confirm('Are you sure you want to delete this pet?');">
                                        <button type="submit" 
                                                class="btn btn-sm btn-outline-danger" 
                                                title="Delete">
                                            <i class="bi bi-trash-fill"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Search Functionality -->
    <script>
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const searchValue = this.value.toLowerCase();
            const table = document.getElementById('petsTable');
            const rows = table.getElementsByTagName('tbody')[0].getElementsByTagName('tr');
            
            for (let row of rows) {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchValue) ? '' : 'none';
            }
        });
    </script>
</body>
</html>
