<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultations List - Pet Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .list-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="list-container">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h2 class="mb-1"><i class="bi bi-clipboard2-pulse-fill text-success"></i> Consultations List</h2>
                    <p class="text-muted mb-0">All consultation records</p>
                </div>
                <div>
                    <a href="/pet-clinic" class="btn btn-outline-secondary me-2"><i class="bi bi-house"></i> Home</a>
                    <a href="/pet-clinic/consultations/new" class="btn btn-success"><i class="bi bi-file-earmark-plus-fill"></i> New Consultation</a>
                </div>
            </div>
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="input-group input-group-lg">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchInput" placeholder="Search consultations...">
                    </div>
                </div>
                <div class="col-md-6 text-end">
                    <span class="badge bg-success fs-6">Total: <span th:text="${#lists.size(consultations)}">0</span></span>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle" id="consultationsTable">
                    <thead class="table-success">
                        <tr>
                            <th><i class="bi bi-calendar"></i> Date</th>
                            <th><i class="bi bi-heart"></i> Pet</th>
                            <th><i class="bi bi-person"></i> Owner</th>
                            <th><i class="bi bi-file-text"></i> Reason</th>
                            <th><i class="bi bi-currency-dollar"></i> Fee</th>
                            <th class="text-center"><i class="bi bi-gear"></i> Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(consultations)}">
                            <td colspan="6" class="text-center py-5">
                                <i class="bi bi-inbox display-1 text-muted"></i>
                                <p class="mt-3 text-muted">No consultations recorded yet.</p>
                            </td>
                        </tr>
                        <tr th:each="consultation : ${consultations}">
                            <td th:text="${#temporals.format(consultation.consultationDate, 'MMM dd, yyyy')}">Jan 01, 2025</td>
                            <td th:text="${consultation.pet.name}">Fluffy</td>
                            <td th:text="${consultation.pet.owner.firstName + ' ' + consultation.pet.owner.lastName}">John Doe</td>
                            <td th:text="${#strings.abbreviate(consultation.reason, 50)}">Regular checkup</td>
                            <td class="text-success fw-bold" th:text="'$' + ${consultation.fee}">$50.00</td>
                            <td class="text-center">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/consultations/{id}(id=${consultation.id})}" class="btn btn-sm btn-outline-primary" title="View"><i class="bi bi-eye-fill"></i></a>
                                    <a th:href="@{/consultations/edit/{id}(id=${consultation.id})}" class="btn btn-sm btn-outline-warning" title="Edit"><i class="bi bi-pencil-fill"></i></a>
                                    <form th:action="@{/consultations/delete/{id}(id=${consultation.id})}" method="post" style="display: inline;" onsubmit="return confirm('Delete this consultation?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete"><i class="bi bi-trash-fill"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const searchValue = this.value.toLowerCase();
            const rows = document.getElementById('consultationsTable').getElementsByTagName('tbody')[0].getElementsByTagName('tr');
            for (let row of rows) {
                row.style.display = row.textContent.toLowerCase().includes(searchValue) ? '' : 'none';
            }
        });
    </script>
</body>
</html>
