<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation Details - Pet Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .view-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
        .info-card {
            border-left: 4px solid #4facfe;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="view-container">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <h2 class="mb-0"><i class="bi bi-clipboard2-pulse-fill text-success"></i> Consultation Details</h2>
                <div>
                    <a href="/pet-clinic/consultations" class="btn btn-outline-secondary me-2"><i class="bi bi-arrow-left"></i> Back</a>
                    <a th:href="@{/consultations/edit/{id}(id=${consultation.id})}" class="btn btn-warning"><i class="bi bi-pencil-fill"></i> Edit</a>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="info-card">
                        <h5 class="text-success mb-3"><i class="bi bi-info-circle"></i> Consultation Info</h5>
                        <p class="mb-2"><strong><i class="bi bi-calendar"></i> Date:</strong><br><span class="fs-5" th:text="${#temporals.format(consultation.consultationDate, 'MMMM dd, yyyy')}">January 01, 2025</span></p>
                        <p class="mb-0"><strong><i class="bi bi-currency-dollar"></i> Fee:</strong><br><span class="fs-4 text-success fw-bold" th:text="'$' + ${consultation.fee}">$50.00</span></p>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="info-card">
                        <h5 class="text-success mb-3"><i class="bi bi-heart-fill"></i> Pet & Owner</h5>
                        <p class="mb-2"><strong>Pet:</strong><br><a th:href="@{/pets/{id}(id=${consultation.pet.id})}" class="fs-5 text-decoration-none"><span th:text="${consultation.pet.name}">Fluffy</span></a> <span class="badge bg-secondary" th:text="${consultation.pet.type}">Dog</span></p>
                        <p class="mb-0"><strong>Owner:</strong><br><a th:href="@{/owners/{id}(id=${consultation.pet.owner.id})}" class="text-decoration-none"><span th:text="${consultation.pet.owner.firstName + ' ' + consultation.pet.owner.lastName}">John Doe</span></a></p>
                    </div>
                </div>
            </div>
            <div class="mt-4">
                <h5 class="text-success mb-3"><i class="bi bi-file-text-fill"></i> Reason for Visit</h5>
                <div class="card">
                    <div class="card-body">
                        <p class="mb-0" th:text="${consultation.reason}">Regular checkup and vaccination</p>
                    </div>
                </div>
            </div>
            <div class="mt-4 pt-3 border-top">
                <form th:action="@{/consultations/delete/{id}(id=${consultation.id})}" method="post" onsubmit="return confirm('Delete this consultation?');">
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash-fill"></i> Delete Consultation</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
