<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${consultation.id != null ? 'Edit Consultation' : 'New Consultation'} + ' - Pet Clinic'">New Consultation - Pet Clinic</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .form-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <h2 class="mb-0">
                    <i class="bi bi-clipboard2-pulse-fill text-success"></i>
                    <span th:text="${consultation.id != null ? 'Edit Consultation' : 'New Consultation'}">New Consultation</span>
                </h2>
                <a href="/pet-clinic/consultations" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back to List
                </a>
            </div>

            <!-- Error Messages -->
            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i> Please correct the errors below:
                <ul class="mb-0 mt-2">
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Form -->
            <form th:action="@{/consultations}" th:object="${consultation}" method="post">
                <input type="hidden" th:field="*{id}" />
                
                <div class="row g-3">
                    <!-- Pet -->
                    <div class="col-md-6">
                        <label for="pet" class="form-label fw-bold">
                            <i class="bi bi-heart"></i> Pet <span class="text-danger">*</span>
                        </label>
                        <select class="form-select form-select-lg" 
                                id="pet" 
                                th:field="*{pet.id}" 
                                required>
                            <option value="">Select pet...</option>
                            <option th:each="pet : ${pets}" 
                                    th:value="${pet.id}" 
                                    th:text="${pet.name + ' (' + pet.type + ') - Owner: ' + pet.owner.firstName + ' ' + pet.owner.lastName}">
                                Pet Name
                            </option>
                        </select>
                    </div>

                    <!-- Consultation Date -->
                    <div class="col-md-6">
                        <label for="consultationDate" class="form-label fw-bold">
                            <i class="bi bi-calendar"></i> Consultation Date <span class="text-danger">*</span>
                        </label>
                        <input type="date" 
                               class="form-control form-control-lg" 
                               id="consultationDate" 
                               th:field="*{consultationDate}" 
                               th:classappend="${#fields.hasErrors('consultationDate')} ? 'is-invalid' : ''"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('consultationDate')}" th:errors="*{consultationDate}"></div>
                    </div>

                    <!-- Reason -->
                    <div class="col-12">
                        <label for="reason" class="form-label fw-bold">
                            <i class="bi bi-file-text"></i> Reason for Visit <span class="text-danger">*</span>
                        </label>
                        <textarea class="form-control" 
                                  id="reason" 
                                  th:field="*{reason}" 
                                  th:classappend="${#fields.hasErrors('reason')} ? 'is-invalid' : ''"
                                  rows="4" 
                                  placeholder="Describe the reason for consultation..."
                                  required></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></div>
                    </div>

                    <!-- Fee -->
                    <div class="col-md-6">
                        <label for="fee" class="form-label fw-bold">
                            <i class="bi bi-currency-dollar"></i> Consultation Fee <span class="text-danger">*</span>
                        </label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text">$</span>
                            <input type="number" 
                                   class="form-control" 
                                   id="fee" 
                                   th:field="*{fee}" 
                                   th:classappend="${#fields.hasErrors('fee')} ? 'is-invalid' : ''"
                                   step="0.01" 
                                   min="0" 
                                   placeholder="0.00"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fee')}" th:errors="*{fee}"></div>
                        </div>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4 pt-3 border-top">
                    <a href="/pet-clinic/consultations" class="btn btn-lg btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-lg btn-success px-5">
                        <i class="bi bi-check-circle"></i>
                        <span th:text="${consultation.id != null ? 'Update Consultation' : 'Save Consultation'}">Save Consultation</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
