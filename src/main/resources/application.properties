# ========================================
# Pet Clinic Training Project Configuration
# ========================================

# Application Information
spring.application.name=pet-clinic-training
info.app.name=Pet Clinic Management System
info.app.description=Training Project for Dr. Shawn's Clinic
info.app.version=1.0.0
info.app.developer=Bella Solutions

# Server Configuration
server.port=8081
server.servlet.context-path=/pet-clinic

# Database Configuration - MySQL
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/petclinicdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:petclinic}
spring.datasource.password=${MYSQL_PASSWORD:petclinic123}

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Disable JPA open-in-view to prevent lazy loading issues
spring.jpa.open-in-view=false

# H2 Console Configuration (Disabled for MySQL)
spring.h2.console.enabled=false

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.defer-datasource-initialization=true

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Logging Configuration (Training Environment)
logging.level.com.bellasolutions.petclinic=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration (Health Monitoring)
management.endpoints.web.exposure.include=health,info,metrics,beans,env
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# Training Environment Specific
training.mode=true
training.environment=local-development
