# ========================================
# Pet Clinic Training Project Configuration
# ========================================

# Application Information
spring.application.name=pet-clinic-training
info.app.name=Pet Clinic Management System
info.app.description=Training Project for Dr. Shawn's Clinic
info.app.version=1.0.0
info.app.developer=Bella Solutions

# Server Configuration
server.port=8081
server.servlet.context-path=/pet-clinic

# Database Configuration - H2 (In-Memory for Testing)
spring.datasource.url=jdbc:h2:mem:petclinic_training;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable JPA open-in-view to prevent lazy loading issues
spring.jpa.open-in-view=false
spring.datasource.platform=h2

# H2 Console Configuration (Development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.defer-datasource-initialization=true

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Logging Configuration (Training Environment)
logging.level.com.bellasolutions.petclinic=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration (Health Monitoring)
management.endpoints.web.exposure.include=health,info,metrics,beans,env
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# Training Environment Specific
training.mode=true
training.environment=local-development
