# ========================================
# Pet Clinic - Production Configuration (MySQL)
# ========================================

# Application Information
spring.application.name=pet-clinic-production
info.app.name=Pet Clinic Management System
info.app.description=Production Deployment for Dr. Shawn's Clinic
info.app.version=1.0.0
info.app.developer=Bella Solutions

# Server Configuration
server.port=8081
server.servlet.context-path=/pet-clinic

# MySQL Database Configuration
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/petclinicdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:petclinic}
spring.datasource.password=${MYSQL_PASSWORD:petclinic123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Disable JPA open-in-view
spring.jpa.open-in-view=false

# SQL Initialization (runs data.sql on first startup)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Disable H2 Console in Production
spring.h2.console.enabled=false

# Production Logging Configuration
logging.level.com.bellasolutions.petclinic=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration (Restricted)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Error Handling (Hide details in production)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false

